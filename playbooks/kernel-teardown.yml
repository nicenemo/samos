#!/usr/bin/env ansible-playbook
---
- name: Teardown Optimized CachyOS Kernel & Revert to LTS (systemd-boot)
  hosts: systems
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Fallback Kernel Preparation & Removal
    # -------------------------------------------------------------------------
    - name: Ensure linux-cachyos-lts kernel and headers are present
      community.general.pacman:
        name:
          - linux-cachyos-lts
          - linux-cachyos-lts-headers
        state: present

    - name: Remove main optimized CachyOS kernel and headers
      community.general.pacman:
        name:
          - linux-cachyos
          - linux-cachyos-headers
        state: absent

    # -------------------------------------------------------------------------
    # 2. Kernel Command Line Revert
    # -------------------------------------------------------------------------
    - name: Read the kernel tuning parameters
      ansible.builtin.set_fact:
        tuning_tokens: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/samos-tuning.conf').splitlines()
          | map('trim') | reject('match', '(#|$)') | list }}

    # Exact token match, so a parameter that merely contains one of ours is left alone.
    - name: Revert performance kernel parameters from /etc/kernel/cmdline
      ansible.builtin.replace:
        path: /etc/kernel/cmdline
        regexp: '(^|\s+){{ item | regex_escape }}(?=\s|$)'
        replace: ''
      loop: "{{ tuning_tokens }}"
      notify:
        - Rebuild initramfs
        - Update systemd-boot entries

  handlers:
    - name: Rebuild initramfs
      ansible.builtin.command: mkinitcpio -P
      changed_when: true

    - name: Update systemd-boot entries
      ansible.builtin.command: bootctl update
      changed_when: true
      failed_when: false
