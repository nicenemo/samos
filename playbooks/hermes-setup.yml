#!/usr/bin/env ansible-playbook
---
- name: Deploy Hermes Agent Stack
  hosts: systems
  become: true

  vars:
    domain_name: "{{ base_domain | default('lt.hanskruse.eu') }}"
    hermes_hostname: "hermes.{{ domain_name }}"
    hermes_telegram_bot_token: ""  # Vul in of override via extra-vars

  tasks:
    # -------------------------------------------------------------------------
    # 1. Directory Provisioning
    # -------------------------------------------------------------------------
    - name: Ensure Hermes Agent compose and memory directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: docker
        mode: '0775'
      loop:
        - /opt/compose/hermes
        - /var/lib/hermes-data

    # -------------------------------------------------------------------------
    # 2. Render Template & Deploy Container Stack
    # -------------------------------------------------------------------------
    - name: Deploy Hermes Agent docker-compose file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/docker-compose-hermes.j2"
        dest: /opt/compose/hermes/docker-compose.yml
        owner: root
        group: docker
        mode: '0640'

    - name: Start Hermes Agent service via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/compose/hermes
        state: present
