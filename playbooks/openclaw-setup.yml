#!/usr/bin/env ansible-playbook
---
- name: Deploy OpenClaw Stack
  hosts: localhost
  connection: local
  become: true

  vars:
    domain_name: "{{ base_domain | default('lt.hanskruse.eu') }}"
    openclaw_hostname: "openclaw.{{ domain_name }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Directory Provisioning
    # -------------------------------------------------------------------------
    - name: Ensure OpenClaw compose and workspace directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: docker
        mode: '0775'
      loop:
        - /opt/compose/openclaw
        - /var/lib/openclaw-data

    # -------------------------------------------------------------------------
    # 2. Render Template & Deploy Container Stack
    # -------------------------------------------------------------------------
    - name: Deploy OpenClaw docker-compose file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/docker-compose-openclaw.j2"
        dest: /opt/compose/openclaw/docker-compose.yml
        owner: root
        group: docker
        mode: '0640'

    - name: Start OpenClaw service via Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/compose/openclaw
        state: present
