#!/usr/bin/env ansible-playbook
---
- name: Distribute Elasticsearch Package to Systems
  hosts: systems
  become: true
  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"
    build_dir: "{{ project_root }}/build/elasticsearch"
    pkg_file_name: "elasticsearch-{{ elk_version | default('9.5.5') }}-1-x86_64.pkg.tar.zst"
    remote_pkg_path: "/tmp/{{ pkg_file_name }}"

  tasks:
    - name: Check if Elasticsearch is already installed
      ansible.builtin.command:
        cmd: "pacman -Q elasticsearch"
      register: pacman_check
      failed_when: false
      changed_when: false

    - name: Copy built Elasticsearch package to target system
      ansible.builtin.copy:
        src: "{{ build_dir }}/{{ pkg_file_name }}"
        dest: "{{ remote_pkg_path }}"
        mode: '0644'
      when: pacman_check.rc != 0
