#!/usr/bin/env ansible-playbook
---
- name: Install Optimized CachyOS Kernel (systemd-boot)
  hosts: systems
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Package Installation
    # -------------------------------------------------------------------------
    - name: Refresh pacman sync databases
      ansible.builtin.command:
        cmd: pacman -Sy
      changed_when: true

    - name: Install main optimized CachyOS kernel and headers alongside LTS
      community.general.pacman:
        name:
          - linux-cachyos
          - linux-cachyos-headers
          - amd-ucode
        state: present

    # -------------------------------------------------------------------------
    # 2. Kernel Command Line (systemd-boot)
    # -------------------------------------------------------------------------
    - name: Ensure /etc/kernel/cmdline exists
      ansible.builtin.file:
        path: /etc/kernel/cmdline
        state: touch
        owner: root
        group: root
        mode: '0644'
        modification_time: preserve
        access_time: preserve

    - name: Read the kernel tuning parameters
      ansible.builtin.set_fact:
        tuning_tokens: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../files/samos-tuning.conf').splitlines()
          | map('trim') | reject('match', '(#|$)') | list }}

    - name: Apply Framework AI 300 kernel performance parameters
      ansible.builtin.include_tasks: tasks/kernel-cmdline.yml
      vars:
        cmdline_tokens: "{{ tuning_tokens }}"

    # -------------------------------------------------------------------------
    # 3. DKMS Rebuild & Initramfs
    # -------------------------------------------------------------------------
    - name: Find target module directory for linux-cachyos
      ansible.builtin.find:
        paths: /usr/lib/modules
        file_type: directory
        patterns: '*cachyos*'
        excludes: '*lts*'
      register: kernel_module_dirs

    - name: Extract target kernel release string
      ansible.builtin.set_fact:
        target_kernel_release: "{{ kernel_module_dirs.files | map(attribute='path') | map('basename') | first }}"
      when: kernel_module_dirs.files | length > 0

    - name: Rebuild configured DKMS modules for new kernel
      ansible.builtin.command:
        cmd: "dkms autoinstall -k {{ target_kernel_release }}"
      register: dkms_result
      changed_when: dkms_result.rc == 0
      when: target_kernel_release is defined

    # -------------------------------------------------------------------------
    # 4. Verification (no automatic reboot: this play runs on the machine itself)
    # -------------------------------------------------------------------------
    - name: Read the running kernel command line
      ansible.builtin.slurp:
        src: /proc/cmdline
      register: live_cmdline_raw

    - name: Report parameters that need a reboot to become active
      ansible.builtin.debug:
        msg: >-
          Reboot required: not yet in /proc/cmdline:
          {{ tuning_tokens | difference((live_cmdline_raw.content | b64decode).split()) | join(' ') }}
      when: tuning_tokens | difference((live_cmdline_raw.content | b64decode).split()) | length > 0

  handlers:
    - name: Rebuild initramfs
      ansible.builtin.command: mkinitcpio -P
      changed_when: true

    - name: Update systemd-boot entries
      ansible.builtin.command: bootctl update
      changed_when: true
      failed_when: false
