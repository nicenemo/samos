#!/usr/bin/env ansible-playbook
---
- name: Configure Elasticsearch Single-Node Instance
  hosts: systems
  become: true
  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"
    es_elastic_password: "{{ lookup('ansible.builtin.password', project_root ~ '/credentials/elastic_password.txt length=24 chars=ascii_letters,digits') }}"
    es_node_ip: "{{ (elasticsearch_ip | default(ansible_host | default('127.0.0.1'))).split('/')[0] }}"
    es_domain: "es.lt.hanskruse.eu"

  tasks:
    - name: End play for nodes without the elasticsearch_node role
      ansible.builtin.meta: end_host
      when: "'elasticsearch_node' not in (cluster_roles | default([]))"

    - name: Ensure domain resolution entry exists in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.0.1 {{ es_domain }}"
        state: present

    - name: Check if Elasticsearch node data is initialized
      ansible.builtin.stat:
        path: /var/lib/elasticsearch/nodes
      register: es_data_state

    - name: Ensure configuration directory structure exists
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: elasticsearch
        group: elasticsearch
        mode: '0750'
      loop:
        - /etc/elasticsearch
        - /etc/elasticsearch/jvm.options.d
        - /etc/elasticsearch/certs

    - name: Ensure systemd override directory exists for Elasticsearch
      ansible.builtin.file:
        path: /etc/systemd/system/elasticsearch.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy systemd override configuration
      ansible.builtin.template:
        src: "{{ project_root }}/templates/elasticsearch.service.override.conf.j2"
        dest: /etc/systemd/system/elasticsearch.service.d/override.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart Elasticsearch

    - name: Deploy JVM heap options configuration
      ansible.builtin.template:
        src: "{{ project_root }}/templates/jvm_heap.options.j2"
        dest: /etc/elasticsearch/jvm.options.d/heap.options
        owner: elasticsearch
        group: elasticsearch
        mode: '0640'
      notify: Restart Elasticsearch

    - name: Deploy Elasticsearch configuration template
      ansible.builtin.template:
        src: "{{ project_root }}/templates/elasticsearch.yml.j2"
        dest: /etc/elasticsearch/elasticsearch.yml
        owner: elasticsearch
        group: elasticsearch
        mode: '0660'
      vars:
        node_is_bootstrapped: "{{ es_data_state.stat.exists | default(false) }}"
      notify: Restart Elasticsearch

    - name: Ensure read permissions on core configuration files
      ansible.builtin.file:
        path: "{{ item }}"
        owner: elasticsearch
        group: elasticsearch
        mode: '0640'
      loop:
        - /etc/elasticsearch/jvm.options
        - /etc/elasticsearch/elasticsearch.yml
      ignore_errors: true

    - name: Ensure correct ownership on Elasticsearch directories
      ansible.builtin.file:
        path: "{{ item }}"
        owner: elasticsearch
        group: elasticsearch
        state: directory
      loop:
        - /etc/elasticsearch
        - /var/lib/elasticsearch
        - /var/log/elasticsearch

    - name: Enable and start Elasticsearch service
      ansible.builtin.systemd:
        name: elasticsearch
        enabled: true
        state: started
        daemon_reload: true

    - name: Flush handlers to ensure Elasticsearch service restart is processed
      ansible.builtin.meta: flush_handlers

    - name: Wait for Elasticsearch REST API (9200) port
      ansible.builtin.wait_for:
        host: "{{ es_node_ip }}"
        port: 9200
        state: started
        delay: 2
        timeout: 60

    - name: Wait for Elasticsearch REST API and Security engine to be ready
      ansible.builtin.uri:
        url: "https://{{ es_node_ip }}:9200/_cluster/health"
        validate_certs: false
        status_code: [200, 401]
      register: es_bootstrap_wait
      until: es_bootstrap_wait.status is defined and es_bootstrap_wait.status in [200, 401]
      retries: 30
      delay: 5

    - name: Check if generated elastic password is active
      ansible.builtin.uri:
        url: "https://{{ es_node_ip }}:9200/_cluster/health"
        user: elastic
        password: "{{ es_elastic_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: es_auth_check
      ignore_errors: true
      run_once: true
      no_log: true

    - name: Set elastic user password on cluster via CLI
      ansible.builtin.shell: >
        printf "%s\n%s\n" "{{ es_elastic_password }}" "{{ es_elastic_password }}" |
        /usr/share/elasticsearch/bin/elasticsearch-reset-password
        --username elastic
        --url "https://{{ es_node_ip }}:9200"
        --interactive
        --batch
      when: es_auth_check.status is not defined or es_auth_check.status != 200
      run_once: true
      no_log: true

    # -------------------------------------------------------------------------
    # Node Health Verification
    # -------------------------------------------------------------------------
    - name: Verify Elasticsearch cluster health endpoint
      ansible.builtin.uri:
        url: "https://{{ es_node_ip }}:9200/_cluster/health"
        method: GET
        user: elastic
        password: "{{ es_elastic_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: es_health_check
      until: es_health_check.status is defined and es_health_check.status == 200
      retries: 24
      delay: 5
      no_log: true

    - name: Display active elastic password and cluster status
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "Elasticsearch Node {{ inventory_hostname }} is HEALTHY!"
          - "Cluster Status: {{ es_health_check.json.status }}"
          - "Number of Nodes: {{ es_health_check.json.number_of_nodes }}"
          - ""
          - "Elasticsearch 'elastic' user password:"
          - "  {{ es_elastic_password }}"
          - ""
          - "Test command:"
          - "  curl -k -u elastic:{{ es_elastic_password }} https://{{ es_domain }}:9200/_cluster/health?pretty"
          - "=========================================================="

  handlers:
    - name: Restart Elasticsearch
      ansible.builtin.systemd:
        name: elasticsearch
        daemon_reload: true
        state: restarted
