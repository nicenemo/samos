#!/usr/bin/env ansible-playbook
---
- name: Setup Caddy File Server behind Traefik Proxy for Calibre Library
  hosts: systems
  become: true

  vars:
    project_root: "{{ playbook_dir | dirname }}"
    domain: "{{ calibre_hostname | default('calibre.' + base_domain) }}"

  tasks:
    # -------------------------------------------------------------------------
    # 1. Package Installation & Base Directories
    # -------------------------------------------------------------------------
    - name: Ensure Caddy package is installed
      community.general.pacman:
        name: caddy
        state: present

    - name: Ensure Caddy configuration directory exists
      ansible.builtin.file:
        path: /etc/caddy
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure Traefik dynamic configuration directory exists
      ansible.builtin.file:
        path: /opt/compose/traefik/dynamic
        state: directory
        owner: root
        group: docker
        mode: '0775'

    # -------------------------------------------------------------------------
    # 2. Template Deployment
    # -------------------------------------------------------------------------
    - name: Deploy Caddyfile template
      ansible.builtin.template:
        src: "{{ project_root }}/templates/Caddyfile.j2"
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: '0644'
      notify: Reload Caddy Service

    - name: Deploy Traefik dynamic configuration template
      ansible.builtin.template:
        src: "{{ project_root }}/templates/traefik-calibre.yaml.j2"
        dest: /opt/compose/traefik/dynamic/calibre.yaml
        owner: root
        group: docker
        mode: '0640'

    # -------------------------------------------------------------------------
    # 3. Local Name Resolution & Service Management
    # -------------------------------------------------------------------------
    - name: Add Calibre domain entry to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ ansible_host }} {{ domain }}"
        regexp: ".*{{ domain | regex_escape }}"
        state: present

    - name: Enable and start the Caddy service
      ansible.builtin.service:
        name: caddy
        state: started
        enabled: true

  handlers:
    - name: Reload Caddy Service
      ansible.builtin.service:
        name: caddy
        state: reloaded
