#!/usr/bin/env ansible-playbook
---
- name: Teardown AMD ROCm & NPU Configuration
  hosts: localhost
  connection: local
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Environment & Kernel Cmdline Cleanup
    # -------------------------------------------------------------------------
    - name: Remove ROCm/NPU environment file
      ansible.builtin.file:
        path: /etc/environment.d/50-rocm-npu.conf
        state: absent

    - name: Remove auto-load configuration for amdxdna
      ansible.builtin.file:
        path: /etc/modules-load.d/amdxdna.conf
        state: absent

    - name: Remove amdgpu.gttsize parameter from /etc/kernel/cmdline
      ansible.builtin.replace:
        path: /etc/kernel/cmdline
        regexp: '\s*(amdgpu\.gttsize=81922)'
        replace: ''
      notify:
        - Rebuild initramfs
        - Update systemd-boot entries

    # -------------------------------------------------------------------------
    # 2. Package Purge (Cascade removal)
    # -------------------------------------------------------------------------
    - name: Define ROCm packages list
      ansible.builtin.set_fact:
        rocm_packages:
          - rocm-hip-runtime
          - rocm-opencl-runtime
          - rocm-smi-lib
          - amd-xdna-driver-dkms

    - name: Query installed ROCm packages
      ansible.builtin.command:
        cmd: "pacman -Qq {{ rocm_packages | join(' ') }}"
      register: installed_rocm_check
      changed_when: false
      failed_when: false

    - name: Remove ROCm packages and dependent packages via cascade removal
      ansible.builtin.command:
        cmd: "pacman -Rcn --noconfirm {{ installed_rocm_check.stdout_lines | join(' ') }}"
      register: pacman_remove_rocm
      changed_when: "'removing' in pacman_remove_rocm.stdout"
      when:
        - installed_rocm_check.stdout_lines is defined
        - installed_rocm_check.stdout_lines | length > 0

  handlers:
    - name: Rebuild initramfs
      ansible.builtin.command: mkinitcpio -P
      changed_when: true

    - name: Update systemd-boot entries
      ansible.builtin.command: bootctl update
      changed_when: true
      failed_when: false
