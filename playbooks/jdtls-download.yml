#!/usr/bin/env ansible-playbook
---
- name: Download jdtls
  hosts: systems
  gather_facts: true

  vars:
    project_root: "{{ playbook_dir | dirname }}"
    target_version: "{{ jdtls_version }}"
    build_user: "{{ target_user }}"

  tasks:
    - name: Set resolved version fact
      ansible.builtin.set_fact:
        resolved_jdtls_version: "{{ target_version }}"

    - name: Display active jdtls version
      ansible.builtin.debug:
        msg: "jdtls target version set to: {{ resolved_jdtls_version }}"

    # Define build path variables
    - name: Set path facts for local build
      ansible.builtin.set_fact:
        build_dir: "{{ project_root }}/build/jdtls"
        pkg_file_name: "jdtls-{{ resolved_jdtls_version }}-1-any.pkg.tar.zst"

    - name: Ensure target build directory exists
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        owner: "{{ build_user }}"
        mode: '0755'

    - name: Look up the tarball name of the milestone
      ansible.builtin.uri:
        url: "https://download.eclipse.org/jdtls/milestones/{{ resolved_jdtls_version }}/latest.txt"
        return_content: true
      register: jdtls_latest
      check_mode: false
      changed_when: false

    - name: Download the jdtls milestone tarball locally (checksum verified)
      ansible.builtin.get_url:
        url: "{{ jdtls_url }}"
        dest: "{{ build_dir }}/jdtls-{{ resolved_jdtls_version }}.tar.gz"
        checksum: "sha256:{{ jdtls_url }}.sha256"
        mode: '0644'
      vars:
        jdtls_url: >-
          https://download.eclipse.org/jdtls/milestones/{{ resolved_jdtls_version }}/{{ jdtls_latest.content | trim }}
