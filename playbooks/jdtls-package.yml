#!/usr/bin/env ansible-playbook
---
- name: Build CachyOS jdtls Package.
  hosts: systems
  gather_facts: true

  vars:
    project_root: "{{ playbook_dir if not playbook_dir.endswith('playbooks') else playbook_dir ~ '/..' }}"
    target_version: "{{ hostvars[groups['systems'][0]]['jdtls_version'] if (groups['systems'] is defined and hostvars[groups['systems'][0]]['jdtls_version'] is defined) else '1.45.0' }}"
    build_user: "{{ ansible_facts['env']['SUDO_USER'] | default(ansible_facts['env']['USER'] | default(lookup('ansible.builtin.env', 'USER'))) }}"

  tasks:
    - name: Set resolved version fact
      ansible.builtin.set_fact:
        resolved_jdtls_version: "{{ target_version }}"

    - name: Display active jdtls version
      ansible.builtin.debug:
        msg: "jdtls version to package: {{ resolved_jdtls_version }}"

    - name: Set path facts for local build
      ansible.builtin.set_fact:
        build_dir: "{{ project_root }}/build/jdtls"
        pkg_build_dir: "{{ project_root }}/build/jdtls/pkg_build"
        pkg_file_name: "jdtls-{{ resolved_jdtls_version }}-1-any.pkg.tar.zst"

    - name: Check if CachyOS package already exists locally
      ansible.builtin.stat:
        path: "{{ build_dir }}/{{ pkg_file_name }}"
      register: local_pkg_stat

    - name: Ensure pkg_build directory exists with correct ownership
      ansible.builtin.file:
        path: "{{ pkg_build_dir }}"
        state: directory
        owner: "{{ build_user }}"
        group: "{{ build_user }}"
        mode: '0755'

    - name: Ensure build directories are owned by standard user
      ansible.builtin.file:
        path: "{{ build_dir }}"
        owner: "{{ build_user }}"
        group: "{{ build_user }}"
        recurse: true

    - name: Generate PKGBUILD file from template
      ansible.builtin.template:
        src: "{{ project_root }}/templates/jdtls-pkg/PKGBUILD.j2"
        dest: "{{ pkg_build_dir }}/PKGBUILD"
        mode: '0644'
      vars:
        jdtls_version: "{{ resolved_jdtls_version }}"

    - name: Copy downloaded tarball to pkg_build directory
      ansible.builtin.copy:
        src: "{{ build_dir }}/jdtls-{{ resolved_jdtls_version }}.tar.gz"
        dest: "{{ pkg_build_dir }}/jdt-language-server-latest.tar.gz"
      when: not local_pkg_stat.stat.exists

    - name: Build CachyOS package using makepkg as unprivileged user
      ansible.builtin.command:
        cmd: "makepkg -f --nodeps"
        chdir: "{{ pkg_build_dir }}"
      become: true
      become_user: "{{ build_user }}"
      when: not local_pkg_stat.stat.exists

    - name: Move built package to root build folder
      ansible.builtin.command:
        cmd: "mv {{ pkg_build_dir }}/{{ pkg_file_name }} {{ build_dir }}/{{ pkg_file_name }}"
      when: not local_pkg_stat.stat.exists
