#!/usr/bin/env ansible-playbook
---
- name: Teardown OpenCode Stack & Purge Data
  hosts: localhost
  connection: local
  become: true

  tasks:
    # -------------------------------------------------------------------------
    # 1. Container Termination
    # -------------------------------------------------------------------------
    - name: Stop and remove OpenCode Docker Compose stack
      community.docker.docker_compose_v2:
        project_src: /opt/compose/opencode
        state: absent
      failed_when: false

    # -------------------------------------------------------------------------
    # 2. Storage Cleanup
    # -------------------------------------------------------------------------
    - name: Purge OpenCode compose and workspace directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/compose/opencode
        - /var/lib/opencode-workspace
