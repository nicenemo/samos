all:
  vars:
    base_domain: lt.hanskruse.eu
    bootstrap_user: kruse
    ansible_management_user: myansibleuser
    ansible_user: "{{ ansible_management_user }}"
    ansible_python_interpreter: /usr/bin/python3
    common_packages:
      - neovim
      - tmux
      - btop
      - wget
      - networkmanager
    firestorm_users:
      - kruse
      - giesen
    ca_valid_days: 3650
    leaf_valid_days: 200
    cert_organization: "Vogon Deep-Space Avian & DTN Transit Board (RFC 1149 / RFC 9171)"
    cert_organizational_unit: "Office for Directing DTN Bundle Custody Transfers of WireGuard-over-BLE HID Service 0x1812 Page 0x20 (HUD) over hid-ebpf to the Outer Rim"
    cert_root_ca_cn: "B.I.R.D. (BIRD Interstellar Recursive Defenestration) Root CA"
    elk_version: 9.5.5
    jdtls_version: 1.54.0
    
    # Lemonade Server Parameters
    lemonade_port: 13305
    lemonade_host: "0.0.0.0"
    lemonade_extra_models_dir: "/home/user/.cache/lemonade/models"
    
    # Model Configuration (Framework 13 AI 300 - 48GB iGPU Allocation)
    # Model Configuration (Framework 13 AI 300 - 48GB iGPU Allocation)
    lemonade_models:
      #- name: "jina-ocr-v1"
      #  repo: "ahmadw/jina-ocr-v1-GGUF:Q4_K_M"
      #  type: "llm"

      # --- Jina v5 Embeddings Generation (Latest) ---
      - name: "jina-embeddings-v5-text-nano-retrieval"
        repo: "jinaai/jina-embeddings-v5-text-nano-retrieval-GGUF:Q4_K_M"
        type: "embedding"
      - name: "jina-embeddings-v5-text-small-retrieval"
        repo: "jinaai/jina-embeddings-v5-text-small-retrieval-GGUF:Q4_K_M"
        type: "embedding"
      - name: "jina-embeddings-v5-omni-small"
        repo: "jinaai/jina-embeddings-v5-omni-small-clustering-GGUF:Q4_K_M"
        type: "embedding"

      # --- Latest Jina Rerankers (v3 is current SOTA for text; m0 for multimodal) ---
      - name: "jina-reranker-v3"
        repo: "jinaai/jina-reranker-v3-GGUF:Q4_K_M"
        type: "reranker"
      - name: "jina-reranker-v2-base-multilingual"
        repo: "gpustack/jina-reranker-v2-base-multilingual-GGUF:Q4_K_M"
        type: "reranker"

      # --- Non-Jina Models (Disabled) ---
      # - name: "gemma-2-2b-it-Q4_K_M"
      #   repo: "bartowski/gemma-2-2b-it-GGUF:Q4_K_M"
      #   type: "llm"
      # - name: "Llama-3.2-3B-Instruct-RyzenAI"
      #   repo: "amd/Llama-3.2-3B-Instruct-onnx-ryzenai-1.3"
      #   type: "llm"
      # - name: "Phi-3.5-mini-instruct-RyzenAI"
      #   repo: "amd/Phi-3.5-mini-instruct-onnx-ryzenai-1.3"
      #   type: "llm"
      # - name: "Qwen2.5-Coder-32B-Instruct-Q8_0"
      #   repo: "Qwen/Qwen2.5-Coder-32B-Instruct-GGUF:qwen2.5-coder-32b-instruct-q8_0"
      #   type: "llm"
      # - name: "DeepSeek-R1-Distill-Qwen-32B-Q8_0"
      #   repo: "bartowski/DeepSeek-R1-Distill-Qwen-32B-GGUF:Q8_0"
      #   type: "llm"
      # - name: "Llama-3.3-70B-Instruct-Q4_K_M"
      #   repo: "bartowski/Llama-3.3-70B-Instruct-GGUF:Q4_K_M"
      #   type: "llm"
    cluster_roles:
      - elasticsearch_node
      - kibana_node
    custom_sans:
      - es.lt.hanskruse.eu
      - kb.lt.hanskruse.eu
    # Memory Sizing Defaults
    es_heap_max_gb: 8
    es_heap_min_gb: 8
    es_heap_size_gb: "{{ [ [ ((ansible_facts['memtotal_mb'] | default(ram_gb * 1024 if ram_gb is defined else 4096)) / 2 / 1024) | round(0, 'floor') | int, es_heap_max_gb ] | min, es_heap_min_gb ] | max }}"
    elasticsearch_ip: 127.0.0.1
    kibana_memory_mb: 2048
    calibre_library_dir: "/home/kruse/Calibre Library"
    calibre_caddy_port: 8080
    calibre_subpath: "/calibre"
    calibre_hostname: "calibre.{{ base_domain }}"

  children:
    systems:
      hosts:
        samos:
          ansible_connection: local
          ansible_host: 127.0.0.1
          target_user: kruse
          secondary_user: giesen
